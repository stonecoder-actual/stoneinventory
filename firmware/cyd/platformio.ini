[platformio]
default_envs = cyd-diagnostics

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/f956c5d8ce3bf39169c7378416b89e7cfe70a034.zip
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -D USER_SETUP_LOADED=1
  -D USE_HSPI_PORT=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000

[env:cyd-diagnostics]
build_flags =
  ${env.build_flags}
  -D DIAGNOSTICS_ONLY=1

[env:cyd-terminal]
build_flags =
  ${env.build_flags}
  -D DIAGNOSTICS_ONLY=0
